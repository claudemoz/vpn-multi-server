root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Commande de build : on compile cmd/app vers tmp/main.exe (Windows-friendly)
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "tmp/main.exe"
  full_bin = ""

  # Fichiers / dossiers à surveiller
  include_ext = ["go", "tpl", "tmpl", "html", "sql", "env"]
  include_dir = ["cmd", "configs", "internal", "pkg", "gen", "migrations"]

  # Fichiers / dossiers à ignorer
  exclude_dir = ["assets", "tmp", "vendor", "bin", "testdata"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true

  # Latence de debounce entre détection et rebuild
  delay = 500
  kill_delay = "2s"
  stop_on_error = true
  send_interrupt = true

  # Log file
  log = "build-errors.log"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
